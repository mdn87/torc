name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest
      - name: CLI smoke
        shell: bash
        run: |
          # doctor is a source-tree health command (walks up from __file__ for the
          # repo); it can't be a smoke for an installed console script. demo is
          # self-contained and exercises the real P0 handoff, so it's the smoke.
          torc --help
          torc --version
          torc demo --state-dir "$(mktemp -d)" --json > /dev/null
