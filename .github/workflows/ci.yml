name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest
      - name: CLI smoke
        shell: bash
        run: |
          # doctor is a source-tree health command (walks up from __file__ for the
          # repo); it can't be a smoke for an installed console script. demo is
          # self-contained and exercises the real P0 handoff, so it's the smoke.
          torc --help
          torc --version
          torc demo --state-dir "$(mktemp -d)" --json > /dev/null
      - name: Installed artifact smoke
        shell: bash
        run: |
          # Artifact commands must find their JSON schemas inside the installed
          # package, so run one from outside the checkout against a throwaway repo.
          cd "$(mktemp -d)"
          git init -q -b main project
          git -C project config user.name "CI"
          git -C project config user.email "ci@example.invalid"
          mkdir project/.lugos
          printf '# Status\n' > project/STATUS.md
          printf 'version: 1\nrepository: local/project\nrecent_commits: 2\nsources:\n  - id: status\n    path: STATUS.md\n    required: true\n' > project/.lugos/project-snapshot.sources.yaml
          git -C project add -A
          git -C project commit -q -m "init"
          torc artifact collect --repository project --config project/.lugos/project-snapshot.sources.yaml --store store --json > /dev/null
